name: Build ArgonSpriteForge Single-File EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore ArgonSpriteForge.csproj

      - name: Publish Single-File Self-Contained EXE (win-x64)
        run: |
          dotnet publish ArgonSpriteForge.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o publish/win-x64

      - name: Verify single EXE output
        shell: pwsh
        run: |
          $exe = "publish/win-x64/ArgonSpriteForge.exe"
          if (!(Test-Path $exe)) { throw "ArgonSpriteForge.exe not found!" }
          $sizeMB = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          Write-Host "Built $exe ($sizeMB MB)"

      - name: Upload ArgonSpriteForge.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArgonSpriteForge-win-x64
          path: publish/win-x64/ArgonSpriteForge.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/win-x64/ArgonSpriteForge.exe
